 <style id="roofaro-services-slider-arrows">
/* --- Services slider arrows -------------------------------------------------
   Framer's Slideshow can only be driven by its own arrows, so those stay in
   charge; this moves them to bottom-centre and restyles them to match the
   Testimonials slider. The buttons carry an inline Web Animation (which
   outranks author !important), so the fill and icon are painted on
   ::before / ::after layers instead of overriding background. */
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type {
  inset: auto auto 0 50% !important;
  transform: translateX(-50%) !important;
  width: auto !important;
  gap: 12px !important;
  justify-content: center !important;
}
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button {
  width: 36px !important;
  height: 36px !important;
  border-radius: 60px !important;
  position: relative !important;
  isolation: isolate !important;
}
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button::before {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  border-radius: 60px !important;
  background: #FAF0EB !important;
  transition: background-color 0.25s ease-out !important;
  z-index: 0 !important;
}
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button:hover::before { background: #F59870 !important; }
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button img { display: none !important; }
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button::after,
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button::after {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  z-index: 1 !important;
  background-color: #0F0F0F !important;
  -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2012h16'/%3E%3Cpath%20d='M14%206l6%206-6%206'/%3E%3C/svg%3E") center center / 16px 16px no-repeat !important;
  mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='black'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2012h16'/%3E%3Cpath%20d='M14%206l6%206-6%206'/%3E%3C/svg%3E") center center / 16px 16px no-repeat !important;
}
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:first-of-type > button[aria-label="Previous"]::after,
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button[aria-label="Previous"]::after { transform: rotate(180deg) !important; }
[data-framer-name="Services Slideshow"] .framer--slideshow-controls > div:last-of-type { display: none !important; }

/* --- Tablet & phone: stack the slide ----------------------------------------
   Slides live at component scope, which has no breakpoints, so the stack is
   expressed with a container query on the slide row itself. It measures the
   slide, not the viewport, so it also holds inside the Framer canvas.
   Desktop starts at a 1040px slide (1200px viewport - 2x80 padding). */
[data-framer-name="Services Slideshow"] [data-framer-name="Slide"] { container-type: inline-size !important; }
@container (max-width: 1039.98px) {
  [data-framer-name="Index"],
  [data-framer-name="Media"],
  [data-framer-name="Details"] {
    flex: 0 0 100% !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }
}

/* --- Testimonials: tighter stacked layout on phone -------------------------
   The slider is a component (no breakpoints), so the phone tweak is a
   container query on the card itself: it stacks below ~600px. */
[data-framer-name^="Testimonial Slide"] { container-type: inline-size !important; }
@container (max-width: 599.98px) {
  [data-framer-name="Portrait"] { height: 320px !important; }
  [data-framer-name="Body"] { padding: 28px !important; min-height: 0 !important; }
}

/* Testimonials slider: same native-arrow treatment as the services slider. */
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type {
  inset: auto auto 0 50% !important;
  transform: translateX(-50%) !important;
  width: auto !important;
  gap: 12px !important;
  justify-content: center !important;
}
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button {
  width: 36px !important; height: 36px !important; border-radius: 60px !important;
  position: relative !important; isolation: isolate !important;
}
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button::before {
  content: "" !important; position: absolute !important; inset: 0 !important;
  border-radius: 60px !important; background: #FAF0EB !important;
  transition: background-color 0.25s ease-out !important; z-index: 0 !important;
}
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button:hover::before { background: #F59870 !important; }
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:first-of-type > button img { display: none !important; }
[data-framer-name="Testimonials Slideshow"] .framer--slideshow-controls > div:last-of-type { display: none !important; }
